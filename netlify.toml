# https://docs.netlify.com/configure-builds/file-based-configuration/
# Canonical / OG / sitemap: production uses primary domain ($URL); previews use deploy URL.
# (DEPLOY_PRIME_URL is often main--site.netlify.app — wrong for canonical on custom domains.)
[build]
  command = "if [ \"$CONTEXT\" = production ]; then export VITE_SITE_URL=\"$URL\"; else export VITE_SITE_URL=\"${DEPLOY_PRIME_URL:-$URL}\"; fi && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Media + hashed bundles: cache forever. /projects/* URLs carry ?v=<content-hash>
# (see scripts/generate-project-media.mjs), so a changed file gets a new URL and
# an unchanged file stays cached across deploys. Vite fingerprints /assets/*.
[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback (safe if you add client routes or deep links later)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
